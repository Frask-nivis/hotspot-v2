<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <meta name="theme-color" content="#f2f2f2">
    <title>info</title>
    <link rel="stylesheet" href="login.css">
    <style>
      /* Prevent autofill styling on mobile browsers */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus,
      input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 30px white inset !important;
        -webkit-text-fill-color: black !important;
        color: black !important;
        background-color: white !important;
      }
      
      /* Ensure form fields maintain their color */
      input[type="text"],
      input[type="password"],
      input[type="submit"],
      .username,
      .password,
      .submit {
        color: black !important;
        background-color: white !important;
        -webkit-text-fill-color: black !important;
        appearance: none !important;
        -webkit-appearance: none !important;
      }
      
      /* Protect wifi and calendar icons */
      .wifi,
      .calender {
        filter: none !important;
        opacity: 1 !important;
        -webkit-filter: none !important;
      }
    </style>
    <script src="script/theme.js" defer></script>
    <script src="script/script.js" defer></script>
    <script src="script/sunpath-debug.js" defer></script>
</head> 
<body> 
  <header class="site-header">  
      <div class="displayGrid">  
        <div class="LeftDis">    
          <div class="wifi" id="wifi"></div>
          <a href="login.html">AbaheerHotspot</a>
        </div> 
        
        <div class="RightDis">     
          <div id="date"></div>     
          <div class="calender"></div>
        </div>
      </div>   
  </header>
  <div class="sunCon">
    <div class="sun"></div>
    <div class="moon"></div>
  </div>
  <div class="starCon"></div>
  <div class="cloudCon"></div>

  <div class="mainCon">
    <div id="greet"></div>    
    <h2 style="color: var(--font); margin: 10px 0; font-size: 3em;">Price List</h2>  
    <div class="infoContainer">    
      <div class="infoOption">
          <div class="opsi1"><h3>Voucher</h3></div>
          <div class="opsi2"><h3>Member</h3></div>
          <div class="opsi3">News</div>    
      </div>
      <div class="infoContent"></div> 
  </div>
  </div>
    <div class="paralax-con">
    <div class="paralax-back"></div>
    <div class="paralax1-back"></div>
    <div class="paralax2-back"></div>  
  </div>
  <footer class="footer">
    <div class="copyright">
      <p style="font-weight: 700;">copyright &copy; 2025 - Abuhurairah Forever <span id="ver"></span></p>   
    </div>
  </footer>
  <script>
    // ===== PRICE LIST FUNCTIONS (asli dari info.html) =====
    const voucher = document.querySelector(".opsi1");
    const member = document.querySelector(".opsi2");
    let list = "VpriceList.csv";
    let isvoucher = true

      function setList(listed) {     
        const data = fetch(listed)
          .then(res => res.text())
          .then(text => {
            const rows = text.trim().split('\n');
            const grid = document.querySelector('.infoContent')
            grid.innerHTML = '';
            rows.forEach((row, rowIndex) => {
              const cols = row.split(',');
              cols.forEach(col => {
                const cell = document.createElement('div');

                cell.className = 'cel';
                cell.textContent = col;  
                grid.appendChild(cell)
              });
            });
          })
          .catch(err => console.error('gagal', err));
        if (!data) {
          console.error('Gagal memuat data');
        }
      }

    if (isvoucher) {
      list = "VpriceList.csv";
      setList(list)
    } else {
      list = "MpriceList.csv";
      setList(list)
    }

    voucher.addEventListener('click', () =>{
      if (isvoucher) return;
      isvoucher = true
      list = "VpriceList.csv";
      voucher.style.backgroundColor = "var(--accentMain)";
      member.style.backgroundColor = "var(--untouched)";
      member.style.color = "#000000"
      voucher.style.color = "#ffffff"
      setList(list)
    })

    member.addEventListener('click', () => {
      if (!isvoucher) return;
      isvoucher = false
      list = "MpriceList.csv"
      voucher.style.backgroundColor = "var(--untouched)";
      member.style.backgroundColor = "var(--accentMain)";
      member.style.color = "#ffffff"
      voucher.style.color = "#000000"
      setList(list)
    })
  </script>
</body>

   
</html>
